# 指数の終値を毎日取って data/indices.json を更新する（スマホ版の「指数と比べる」用）
name: 指数の終値を更新
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 平日 22:30 UTC（日本時間 翌 7:30、米国市場の引け後）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance
      - run: python scripts/fetch_indices.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indices.json
          git diff --cached --quiet || (git commit -m "指数の終値を更新" && git push)
